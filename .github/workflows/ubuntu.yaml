name: Kotlin CI - Ubuntu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Kotlin Compiler
      run: |
        sudo snap install --classic kotlin

    - name: Compile and Run Kotlin files recursively
      run: |
        find src -name "*.kt" > sources.txt
        if [ -s sources.txt ]; then
          kotlinc -script $(cat sources.txt)
        fi
