name: Kotlin CI - Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile and Run Kotlin files
      shell: powershell
      run: |
        $files = (Get-ChildItem -Path src\core -Filter *.kt).FullName -join " "
        
        if ($files) {
            & kotlinc (Invoke-Expression $files) -include-runtime -d app.jar
            
            if ($LASTEXITCODE -eq 0) {
                java -jar app.jar
            } else {
                Write-Error "Kotlin compilation failed."
                exit 1
            }
        }

