name: Kotlin CI - Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Kotlin Compiler
      run: |
        choco install kotlin -y

    - name: Compile and Run Kotlin files
      shell: powershell
      run: |
        $files = Get-ChildItem -Path src -Filter *.kt -Recurse | Select-Object -ExpandProperty FullName
        
        if ($files) {
            kotlinc $files -include-runtime -d app.jar
            java -jar app.jar
        }
